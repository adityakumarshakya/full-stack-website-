<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Orinnovative CMS</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="assets/admin.css" />
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">Orin<span>novative</span> CMS</div>
    <nav>
      <a href="dashboard.html"><span class="label">Dashboard</span></a>
      <a href="seo.html"><span class="label">SEO Management</span></a>
      <a href="google.html"><span class="label">Google Integration</span></a>
      <a href="sitemap-robots.html"><span class="label">Sitemap &amp; Robots</span></a>
      <a href="settings.html"><span class="label">Website Settings</span></a>
      <a href="messages.html"><span class="label">Contact Messages</span></a>
      <a href="media.html"><span class="label">Media Library</span></a>
    </nav>
    <div class="logout"><button class="secondary" onclick="logoutAdmin()">Log out</button></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <h1>Dashboard</h1>
      <div class="who" id="who">&nbsp;</div>
    </div>
    <div class="content">
      <div id="alert-box"></div>
      <div class="grid cols-3" id="stats"></div>

      <div class="card" style="margin-top:20px">
        <h2>Recent Contact Messages</h2>
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Subject</th><th>Received</th><th></th></tr></thead>
          <tbody id="recent-messages"><tr><td colspan="5">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
  requireAuth();

  apiFetch("/auth/me").then((d) => {
    document.getElementById("who").textContent = `${d.admin.name} (${d.admin.role})`;
  }).catch(() => {});

  apiFetch("/dashboard/overview").then((data) => {
    const o = data.overview;
    document.getElementById("stats").innerHTML = `
      <div class="stat"><div class="num">${o.totalMessages}</div><div class="label">Total Contact Messages</div></div>
      <div class="stat"><div class="num">${o.unreadMessages}</div><div class="label">Unread Messages</div></div>
      <div class="stat"><div class="num">${o.seoConfiguredPages}/${o.totalPages}</div><div class="label">Pages With Custom SEO</div></div>
      <div class="stat"><div class="num">${o.totalMedia}</div><div class="label">Uploaded Media Files</div></div>
      <div class="stat"><div class="num" style="font-size:16px;word-break:break-all">${escapeHtml(o.siteUrl)}</div><div class="label">Live Site URL</div></div>
    `;

    const tbody = document.getElementById("recent-messages");
    if (!data.recentMessages.length) {
      tbody.innerHTML = `<tr><td colspan="5">No messages yet.</td></tr>`;
    } else {
      tbody.innerHTML = data.recentMessages.map((m) => `
        <tr class="${m.isRead ? "" : "unread"}">
          <td>${escapeHtml(m.name)}</td>
          <td>${escapeHtml(m.email)}</td>
          <td>${escapeHtml(m.subject || "—")}</td>
          <td>${formatDate(m.createdAt)}</td>
          <td><a href="messages.html">View</a></td>
        </tr>
      `).join("");
    }
  }).catch((err) => showAlert(document.getElementById("alert-box"), err.message));
</script>
</body>
</html>
